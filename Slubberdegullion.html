 head! Yummy!\" %%\"Yeah, Cutana, you and me!\"%%You reach the stables. The place is quiet; it's early and most people are just getting up. Your favorite horse has been out hauling manure for the local farmers. You select another horse and toss a big rag over its back. You pull the halter over his head, then set the bit in his mouth and lay the reins behind his neck. You lead him outside; the slope of the hill there gives you a few extra inches of height. You guide him into position and then leap up onto his back. He's an experienced horse, barely shifting in response to your suddenly landing in his back. Your feet hang down loosely on either side of his flanks. He's an older guy and you chose him because he's not frisky; you won't need to spend the day holding on desperately with your knees. %%Cutana is dancing around excitedly; he can see that you're heading out for an adventure. You wink at him. \"Let's get going, Cutana!\" You head for the northeast gate. One of the guards comes down from the overhead lookout and pushes one of the big doors open for you. You feel the warmth of the sun on the side of your face as you head out into a beautiful day. You've got your fishing spool, a bit of bread in your bag, and your dog at your side.",

enced Romanitas; it was already half-gone when you were a boy. But your uncle Ambrosius Aurelianus delighted in telling you grand tales of what life was like under Romanitas. It seemed heavenly. Now it is gone.%%Now the Saxons have already taken over half the country. You lead the Briton people in the south; further north, other Briton kings try to hold their ground against the ever-growing tide of Saxons and Angles. You've had relative peace for fifteen years now, ever since you kicked their butts at Mount Badon. The Saxons regularly mount raids to steal cattle, pillage, and kill, but the raids are really just demonstrations, not attempts at conquest. %%You give your horse a nod with your reins, and it saunters across the open area around the manor. The roof of the manor house has long since caved in, but there are still roof tiles scattered about. Those old Roman manors were well-built; they didn't leak rain like the thatched roofs your people use now. Of course, buildings like that took a lot of special materials: big oak beams, baked clay roof tiles, bricks, mortar--stuff that had to be brought in from all over the country. They had good roads back then, and plenty of horses and carts to move things.%%You once saw an actual, functioning Roman manor when you were young. It was an impressive building, very large, with a tiled floor and painted walls and plenty of separate rooms. It had rooms on top of the other rooms, and a kind of diagonal ladder for climbing up to the upper rooms. This one, though, was sacked and burned by the Saxons in one of their raids decades ago.%%You sigh. Those were good days. %%Cutana suddenly dashes away at top speed; you can't see what he's after.",

ack with loud, deep voices. The Britons respond with a medley of deep and middle voices. Back and forth the struggle goes, until the Britons unleash their secret weapon: the high voices of the women balanced against the deeper voices of the men. Trounced, the Saxons flee in shame, and the Britons dance in triumph. %%Yes, that's how we should fight our battles, you think. But instead...you recall the young Saxon man you speared a month ago. He was fleeing on foot and you were running him down on your horse. At the last instant, he turned to face you just before the spear rammed into his chest. You cannot purge your mind of the expression of horror and dismay on his face as the spear struck home. You snort angrily and turn your eyes to the distance.%%The forest is continuous all the way to the horizon. For miles and miles the forest stretches, unthinned by human axes. The forest exhales a thin bluish haze. %%Cutana stands beside you in happy camraderie. He's too excited to sit. His alert ears turn to every sound and his eyes dart about in excited appreciation of nature. \"Yep\" you say happily. \"You and me, Cutana. You and me.\"",

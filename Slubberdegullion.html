	// Close the dropdown if the user clicks outside of it
	window.onclick = function(event) {
  	if (!event.target.matches('.dropbtn')) {
    	var dropdowns = document.getElementsByClassName("dropdown-content");
    	var i;
    	for (i = 0; i < dropdowns.length; i++) {
      	var openDropdown = dropdowns[i];
      	if (openDropdown.classList.contains('show')) {
        	openDropdown.classList.remove('show');
      	}
    	}
  	}
	}

	function addButtonClick() {

	function setupEncounter(title) {
		var i = 0;
		while ((i<encounters.length) & (!(title === encounters[i].title))) ++i;
		if (i<encounters.length) {
			iEncounter = i;
			displayEncounter();
		}
	}

	function displayEncounter() {		
    eList.options[iEncounter].selected = true;
		const introElement = document.getElementById("introText");
		var textArray = encounters[iEncounter].introText.split('%%');
		var tempString = "";
  	for(var i = 0; i < textArray.length; i++) {
  			// this is a check for isolated % characters
  			if (textArray[i].includes("%")) console.log("Single % at "+textArray[i]);
  	  	tempString += textArray[i]+"\r\r";
  	  }
//  	  console.log(tempString);
		introElement.textContent = tempString;
		
		var optionText0 = document.getElementById("option0");
		var optionContents = encounters[iEncounter].options[0].optionText;
		optionText0.textContent = optionContents;
		if (optionContents.includes("Unused Option")) {
				optionText0.style.color = "#888888";
		}

		var optionText1 = document.getElementById("option1");
		optionContents = encounters[iEncounter].options[1].optionText;
		optionText1.textContent = optionContents;
//		if (optionContents.includes("Unused Option")) {
//				optionText1.style.color = "#888888";
//		}
		var optionText2 = document.getElementById("option2");
		var optionContents = encounters[iEncounter].options[2].optionText;
		optionText2.textContent = optionContents;
//		if (optionContents.includes("Unused Option")) {
//				optionText2.style.color = "#888888";
//		}
		
		for (i=0; i<3; ++i) {
				let n = i; 
				reactionTextArea[i] = document.getElementById("reaction"+n.toString());
				var contents = encounters[iEncounter].options[i].reactionText;
				reactionTextArea[i].value = contents;
//				if (contents.includes("Unused Reaction")) {
//					reactionTextArea[i].style.color = "#888888";
//				}
        for (var j=0; j<6; ++j) {
          var iSlider = 6*i + j;
        	var globalLabel = document.getElementById("sliderLabel"+iSlider);
        	globalLabel.innerHTML = "∆_"+sliderLabels[j];
          var m = iSlider;
          var subDiv = document.getElementById("sliderElement"+m.toString());    
          sliders[iSlider] = document.getElementById("slider"+m.toString());
          sliders[iSlider].value = encounters[iEncounter]["options"][i]["delta"][j];
          sliders[iSlider].addEventListener("input", function() {
              var x = this.id.substring(6);
              var iOption = Math.floor(x/6);
              var iGlobal = x % 6;
              var theLabel = document.getElementById("valueLabel"+x);
              var y = (this.value - 50)/50;
              theLabel.innerHTML = y;
              encounters[iEncounter]["options"][iOption]["delta"][iGlobal] = this.value;
      			} );
      		var z = (encounters[iEncounter]["options"][i]["delta"][j] - 50)/50;
      		document.getElementById("valueLabel"+iSlider).innerHTML = z;
        }			
		}
	}

		encounterJSON = encounterJSON.replaceAll("@", ",");
		console.log(encounterJSON);
  }
